name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build liquid-ui library
        run: pnpm build:lib

      - name: Typecheck monorepo & library
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run consumer integration test
        run: pnpm test:consumer

      - name: Build standalone documentation site
        run: pnpm build:docs

      - name: Build standalone Studio playground
        run: pnpm build:studio

      - name: Pack library tarball verification
        run: pnpm pack:lib
